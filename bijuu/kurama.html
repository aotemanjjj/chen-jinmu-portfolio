    <style id="theme-vars">
/* ============================================================
   BIJUU ANIMATED POSTERS — Brand CSS
   Weathered collectible-card aesthetic, military/classified document tone.
   One neutral parchment base + per-beast accent hue applied via
   data-beast attributes on the page root.
   ============================================================ */

:root {
  /* ---- Brand primary (parchment / aged document) ---- */
  --bj-primary-50:  #fbfaf6;
  --bj-primary-100: #f4f1e8;
  --bj-primary-200: #e8e2d0;
  --bj-primary-300: #d6cdb2;
  --bj-primary-400: #b8ad8a;
  --bj-primary-500: #9a8c63;
  --bj-primary-600: #7d6f4a;
  --bj-primary-700: #5f5436;
  --bj-primary-800: #3d3621;
  --bj-primary-900: #221f13;

  /* ---- Neutral (ink / concrete) ---- */
  --bj-neutral-0:   #ffffff;
  --bj-neutral-50:  #f6f5f2;
  --bj-neutral-100: #eceae4;
  --bj-neutral-200: #d4d1c8;
  --bj-neutral-300: #b0aca0;
  --bj-neutral-400: #847f70;
  --bj-neutral-500: #5e5a4e;
  --bj-neutral-600: #44413a;
  --bj-neutral-700: #2f2d28;
  --bj-neutral-800: #1d1c19;
  --bj-neutral-900: #100f0e;

  /* ---- State tokens ---- */
  --state-success: #4a7a4a;
  --state-warning: #b8862a;
  --state-error:   #a83232;
  --state-info:    #3a6a8a;

  /* ---- Radius ---- */
  --bj-radius-sm:   2px;
  --bj-radius-md:   8px;
  --bj-radius-lg:   12px;
  --bj-radius-full: 9999px;

  /* ---- Typography ---- */
  --font-display: "Oswald", "Bebas Neue", "Impact", "Noto Sans SC", sans-serif;
  --font-body: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
}

/* ============================================================
   Semantic aliases (required by apply-html-head-contract.mjs)
   ============================================================ */
:root {
  --bj-background: var(--bj-neutral-50);
  --bj-foreground: var(--bj-neutral-900);
  --bj-card: var(--bj-primary-50);
  --bj-card-foreground: var(--bj-neutral-900);
  --bj-popover: var(--bj-neutral-0);
  --bj-popover-foreground: var(--bj-neutral-900);
  --bj-primary: var(--bj-primary-700);
  --bj-primary-foreground: var(--bj-primary-50);
  --bj-muted: var(--bj-neutral-200);
  --bj-muted-foreground: var(--bj-neutral-500);
  --bj-border: var(--bj-neutral-300);
  --bj-input: var(--bj-neutral-300);
  --bj-ring: var(--bj-primary-500);

  /* ---- Per-beast accent (default = neutral ink) ---- */
  --bj-accent: var(--bj-neutral-700);
  --bj-accent-soft: var(--bj-neutral-400);
  --bj-accent-glow: rgba(94, 90, 78, 0.35);
}

/* ============================================================
   Per-beast accent hues — applied via [data-beast="..."]
   Each beast gets: accent, soft tint, glow color, particle color
   ============================================================ */
[data-beast="shukaku"] {
  --bj-accent: #c98a3a;       /* sand gold */
  --bj-accent-soft: #e0b878;
  --bj-accent-glow: rgba(201, 138, 58, 0.45);
  --bj-particle: #d9a85a;
}
[data-beast="matatabi"] {
  --bj-accent: #2e6fb5;       /* spectral blue */
  --bj-accent-soft: #6aa3d8;
  --bj-accent-glow: rgba(46, 111, 181, 0.5);
  --bj-particle: #5aa0e8;
}
[data-beast="isobu"] {
  --bj-accent: #3f7a5e;       /* mist green */
  --bj-accent-soft: #7aaa90;
  --bj-accent-glow: rgba(63, 122, 94, 0.45);
  --bj-particle: #6aa080;
}
[data-beast="kokuo"] {
  --bj-accent: #5b8fc4;       /* boil water blue */
  --bj-accent-soft: #9bc0e0;
  --bj-accent-glow: rgba(91, 143, 196, 0.45);
  --bj-particle: #8ab8e0;
}
[data-beast="saiken"] {
  --bj-accent: #3fb0a8;       /* acid teal */
  --bj-accent-soft: #7fd4cd;
  --bj-accent-glow: rgba(63, 176, 168, 0.5);
  --bj-particle: #5fd4c8;
}
[data-beast="chomei"] {
  --bj-accent: #4ea64e;       /* beetle emerald */
  --bj-accent-soft: #8acc84;
  --bj-accent-glow: rgba(78, 166, 78, 0.45);
  --bj-particle: #7ac870;
}
[data-beast="gyuki"] {
  --bj-accent: #7a3fb0;       /* ink violet */
  --bj-accent-soft: #b07fd4;
  --bj-accent-glow: rgba(122, 63, 176, 0.5);
  --bj-particle: #a070d8;
}
[data-beast="kurama"] {
  --bj-accent: #d24a2a;       /* fox crimson */
  --bj-accent-soft: #e88a6a;
  --bj-accent-glow: rgba(210, 74, 42, 0.5);
  --bj-particle: #e86a4a;
}

/* ============================================================
   Dark mode aliases
   ============================================================ */
.dark {
  --bj-background: var(--bj-neutral-900);
  --bj-foreground: var(--bj-neutral-100);
  --bj-card: var(--bj-neutral-800);
  --bj-card-foreground: var(--bj-neutral-100);
  --bj-popover: var(--bj-neutral-800);
  --bj-popover-foreground: var(--bj-neutral-100);
  --bj-primary: var(--bj-primary-400);
  --bj-primary-foreground: var(--bj-neutral-900);
  --bj-muted: var(--bj-neutral-700);
  --bj-muted-foreground: var(--bj-neutral-400);
  --bj-border: var(--bj-neutral-700);
  --bj-input: var(--bj-neutral-600);
  --bj-ring: var(--bj-primary-300);
}

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }

  }

    <style>
      /* ============ KURAMA KEYFRAMES — FIRE / EMBER THEME ============ */

      /* Hero explosion entrance: bursts through with fire/embers */
      @keyframes kurama-burst-in {
        0%   { transform: scale(0.55) rotate(-6deg); opacity: 0; filter: blur(16px) brightness(2.2) saturate(1.8); }
        30%  { opacity: 1; filter: blur(0) brightness(1.5) saturate(1.4); }
        55%  { transform: scale(1.08) rotate(1.5deg); filter: blur(0) brightness(1.15) saturate(1.2); }
        75%  { transform: scale(0.98) rotate(-0.5deg); }
        100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0) brightness(1) saturate(1); }
      }

      /* Continuous breathing scale on hero */
      @keyframes kurama-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.03); }
      }

      /* Rising fire embers — float up, flicker, fade at top with orange glow */
      @keyframes ember-rise {
        0%   { transform: translate(0, 0) scale(1); opacity: 0; }
        8%   { opacity: 1; }
        40%  { transform: translate(var(--drift-x, 20px), -40vh) scale(0.85); opacity: 0.85; }
        75%  { transform: translate(calc(var(--drift-x, 20px) * 1.5), -75vh) scale(0.5); opacity: 0.5; }
        100% { transform: translate(calc(var(--drift-x, 20px) * 1.8), -105vh) scale(0.2); opacity: 0; }
      }

      /* Ember flicker (opacity pulse while rising) */
      @keyframes ember-flicker {
        0%, 100% { filter: brightness(1) drop-shadow(0 0 3px var(--bj-particle)); }
        25%      { filter: brightness(1.4) drop-shadow(0 0 6px var(--bj-accent)); }
        50%      { filter: brightness(0.8) drop-shadow(0 0 2px var(--bj-accent-soft)); }
        75%      { filter: brightness(1.25) drop-shadow(0 0 5px var(--bj-particle)); }
      }

      /* Fire glow pulsing around hero edges — warm orange radial glow */
      @keyframes fire-glow-pulse {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        35%      { opacity: 0.9; transform: scale(1.04); }
        65%      { opacity: 0.7; transform: scale(1.02); }
      }

      /* Nine tails flowing/flickering fire shimmer overlay */
      @keyframes tail-flicker {
        0%, 100% { opacity: 0.25; transform: translateX(0) scaleY(1); }
        20%      { opacity: 0.5; transform: translateX(-2px) scaleY(1.03); }
        40%      { opacity: 0.35; transform: translateX(2px) scaleY(0.98); }
        60%      { opacity: 0.55; transform: translateX(-1px) scaleY(1.02); }
        80%      { opacity: 0.3; transform: translateX(1px) scaleY(1); }
      }

      /* Crimson eyes intense pulsing glow */
      @keyframes eye-pulse {
        0%, 100% { opacity: 0.7; filter: blur(3px) brightness(1); }
        30%      { opacity: 1; filter: blur(5px) brightness(1.6); }
        60%      { opacity: 0.85; filter: blur(4px) brightness(1.3); }
      }

      /* Heat distortion/shimmer near bottom */
      @keyframes heat-shimmer {
        0%, 100% { transform: translateY(0) scaleX(1); opacity: 0.4; filter: blur(2px); }
        50%      { transform: translateY(-2px) scaleX(1.02); opacity: 0.6; filter: blur(3px); }
      }

      /* Flame wisp trails drifting upward */
      @keyframes flame-wisp {
        0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0; }
        15%  { opacity: 0.6; }
        50%  { transform: translate(var(--wisp-x, 10px), -30vh) scale(1.4) rotate(15deg); opacity: 0.45; }
        100% { transform: translate(calc(var(--wisp-x, 10px) * 2), -65vh) scale(0.6) rotate(-10deg); opacity: 0; }
      }

      /* Scratch marks fiery reveal — clip wipe + glow */
      @keyframes scratch-reveal {
        0%   { clip-path: inset(0 100% 0 0); opacity: 0; transform: translateX(-14px) skewX(-12deg); filter: brightness(3); }
        35%  { opacity: 1; filter: brightness(2.2); }
        65%  { clip-path: inset(0 0 0 0); opacity: 1; transform: translateX(0) skewX(-12deg); filter: brightness(1.4); }
        100% { clip-path: inset(0 0 0 0); opacity: 0.92; transform: translateX(0) skewX(-12deg); filter: brightness(1); }
      }

      /* Title fire-flicker glow */
      @keyframes title-fire-flicker {
        0%, 100% { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 8px var(--bj-accent-glow), 0 0 18px var(--bj-accent-glow); }
        20%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 14px var(--bj-accent), 0 0 28px var(--bj-accent-glow); }
        40%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 6px var(--bj-accent-soft), 0 0 14px var(--bj-accent-glow); }
        60%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 16px var(--bj-accent), 0 0 32px var(--bj-accent-glow); }
        80%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 10px var(--bj-accent-soft), 0 0 22px var(--bj-accent-glow); }
      }

      /* Rotating seal */
      @keyframes seal-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* Spiral pulse */
      @keyframes spiral-pulse {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
        50%      { transform: scale(1.12) rotate(20deg); opacity: 1; }
      }

      /* Vertical Japanese text slide-in */
      @keyframes kanji-slide-in {
        0%   { opacity: 0; transform: translateY(-18px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      /* Staggered fade-up for info panel */
      @keyframes info-fade-up {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Hazard triangle pulse */
      @keyframes hazard-pulse {
        0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
        50%      { opacity: 0.55; transform: scale(0.92); filter: drop-shadow(0 0 8px rgba(210,74,42,0.8)); }
      }

      /* Threat-rating star fill (one-by-one) */
      @keyframes star-fill {
        0%   { color: var(--bj-neutral-300); transform: scale(0.4) rotate(-30deg); }
        60%  { transform: scale(1.25) rotate(8deg); }
        100% { color: var(--bj-accent); transform: scale(1) rotate(0deg); }
      }

      /* Barcode scan line sweep */
      @keyframes barcode-scan {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      /* Scanline subtle vertical drift */
      @keyframes scanline-drift {
        from { background-position: 0 0; }
        to   { background-position: 0 100px; }
      }

      /* Grain flicker */
      @keyframes grain-flicker {
        0%, 100% { opacity: 0.06; }
        50%      { opacity: 0.1; }
      }

      /* Card frame settle-in */
      @keyframes card-settle {
        0%   { opacity: 0; transform: translateY(20px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Stamp thud */
      @keyframes stamp-thud {
        0%   { transform: scale(2.4) rotate(-24deg); opacity: 0; }
        60%  { transform: scale(0.92) rotate(-13deg); opacity: 1; }
        80%  { transform: scale(1.04) rotate(-15deg); }
        100% { transform: scale(1) rotate(-15deg); opacity: 0.92; }
      }

      /* Debris shift on shattered border */
      @keyframes debris-shift {
        0%, 100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
        25%      { transform: translate(2px, -1px) rotate(calc(var(--rot, 0deg) + 3deg)); }
        50%      { transform: translate(-1px, 2px) rotate(calc(var(--rot, 0deg) - 2deg)); }
        75%      { transform: translate(1px, 1px) rotate(calc(var(--rot, 0deg) + 1deg)); }
      }

      /* ============ ANIMATION UTILITIES ============ */
      .anim-burst        { animation: kurama-burst-in 1.7s cubic-bezier(0.2, 0.85, 0.25, 1) both; }
      .anim-breathe      { animation: kurama-breathe 5.5s ease-in-out infinite; }
      /* Combined: burst entrance once, then continuous breathing starting after entrance */
      .anim-burst-breathe {
        animation: kurama-burst-in 1.7s cubic-bezier(0.2, 0.85, 0.25, 1) both,
                   kurama-breathe 5.5s ease-in-out 1.8s infinite;
      }
      .anim-seal-spin    { animation: seal-spin 24s linear infinite; }
      .anim-spiral       { animation: spiral-pulse 4s ease-in-out infinite; }
      .anim-hazard       { animation: hazard-pulse 1.5s ease-in-out infinite; }
      .anim-card-settle  { animation: card-settle 0.9s ease-out both; }
      .anim-grain        { animation: grain-flicker 0.18s steps(2) infinite; }
      .anim-fire-flicker { animation: title-fire-flicker 3.2s ease-in-out infinite; }
      .anim-stamp        { animation: stamp-thud 0.7s cubic-bezier(0.3, 1.6, 0.4, 1) both; animation-delay: 2.2s; }

      .anim-scratch-1 { animation: scratch-reveal 0.95s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.15s; }
      .anim-scratch-2 { animation: scratch-reveal 0.95s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.4s; }
      .anim-scratch-3 { animation: scratch-reveal 0.95s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.65s; }

      .anim-kanji { animation: kanji-slide-in 0.9s ease-out both; }

      .anim-info-1 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.5s; }
      .anim-info-2 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.65s; }
      .anim-info-3 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.8s; }
      .anim-info-4 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.95s; }
      .anim-info-5 { animation: info-fade-up 0.6s ease-out both; animation-delay: 1.1s; }
      .anim-info-6 { animation: info-fade-up 0.6s ease-out both; animation-delay: 1.25s; }

      .anim-star-1 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 2.5s; }
      .anim-star-2 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 2.75s; }
      .anim-star-3 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 3.0s; }
      .anim-star-4 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 3.25s; }
      .anim-star-5 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 3.5s; }

      .anim-debris { animation: debris-shift 7s ease-in-out infinite; }

      /* Fire glow around hero (pulsing radial) */
      .anim-fire-glow { animation: fire-glow-pulse 3.8s ease-in-out infinite; }

      /* Eye glow pulse */
      .anim-eye-glow { animation: eye-pulse 2.4s ease-in-out infinite; }

      /* Heat shimmer near bottom */
      .anim-heat { animation: heat-shimmer 2.6s ease-in-out infinite; }

      <script>
        // ====== Fire ember + flame wisp generation ======
        (function () {
          var layer = document.getElementById('kmParticles');
          if (!layer) return;
          var COUNT = window.innerWidth < 768 ? 34 : 70;
          var frag = document.createDocumentFragment();

          for (var i = 0; i < COUNT; i++) {
            // 70% embers, 30% flame wisps
            if (Math.random() < 0.7) {
              // ---- Rising ember ----
              var p = document.createElement('span');
              p.className = 'ember-particle';
              var size = Math.random() * 3 + 1.2;
              var riseDur = (Math.random() * 7 + 6).toFixed(2);
              var riseDelay = (Math.random() * -12).toFixed(2);
              var driftX = (Math.random() * 100 - 50).toFixed(0);
              p.style.width = size + 'px';
              p.style.height = size + 'px';
              p.style.left = (Math.random() * 100) + '%';
              p.style.top = (80 + Math.random() * 20) + '%';
              p.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);
              p.style.setProperty('--rise-dur', riseDur + 's');
              p.style.setProperty('--rise-delay', riseDelay + 's');
              p.style.setProperty('--drift-x', driftX + 'px');
              frag.appendChild(p);
            } else {
              // ---- Flame wisp trail ----
              var w = document.createElement('span');
              w.className = 'flame-wisp';
              var wSize = Math.random() * 14 + 8;
              var wDur = (Math.random() * 5 + 5).toFixed(2);
              var wDelay = (Math.random() * -10).toFixed(2);
              var wX = (Math.random() * 80 - 40).toFixed(0);
              w.style.width = wSize + 'px';
              w.style.height = (wSize * 1.6) + 'px';
              w.style.left = (Math.random() * 100) + '%';
              w.style.top = (75 + Math.random() * 20) + '%';
              w.style.setProperty('--wisp-dur', wDur + 's');
              w.style.setProperty('--wisp-delay', wDelay + 's');
              w.style.setProperty('--wisp-x', wX + 'px');
              frag.appendChild(w);
            }
          }
          layer.appendChild(frag);
        })();

        // ====== Barcode bars generation ======
        (function () {
          var bars = document.getElementById('kmBars');
          if (!bars) return;
          var pattern = [3,1,2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,1,1,2,1,3,1,2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,1];
          var frag = document.createDocumentFragment();
          for (var i = 0; i < pattern.length; i++) {
            var b = document.createElement('span');
            b.style.width = pattern[i] + 'px';
            b.style.height = '100%';
            frag.appendChild(b);
          }
          bars.appendChild(frag);
        })();
      </script>
    </main>

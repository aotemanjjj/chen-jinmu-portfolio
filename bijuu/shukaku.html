    <style id="theme-vars">
/* ============================================================
   BIJUU ANIMATED POSTERS — Brand CSS
   Weathered collectible-card aesthetic, military/classified document tone.
   One neutral parchment base + per-beast accent hue applied via
   data-beast attributes on the page root.
   ============================================================ */

:root {
  /* ---- Brand primary (parchment / aged document) ---- */
  --bj-primary-50:  #fbfaf6;
  --bj-primary-100: #f4f1e8;
  --bj-primary-200: #e8e2d0;
  --bj-primary-300: #d6cdb2;
  --bj-primary-400: #b8ad8a;
  --bj-primary-500: #9a8c63;
  --bj-primary-600: #7d6f4a;
  --bj-primary-700: #5f5436;
  --bj-primary-800: #3d3621;
  --bj-primary-900: #221f13;

  /* ---- Neutral (ink / concrete) ---- */
  --bj-neutral-0:   #ffffff;
  --bj-neutral-50:  #f6f5f2;
  --bj-neutral-100: #eceae4;
  --bj-neutral-200: #d4d1c8;
  --bj-neutral-300: #b0aca0;
  --bj-neutral-400: #847f70;
  --bj-neutral-500: #5e5a4e;
  --bj-neutral-600: #44413a;
  --bj-neutral-700: #2f2d28;
  --bj-neutral-800: #1d1c19;
  --bj-neutral-900: #100f0e;

  /* ---- State tokens ---- */
  --state-success: #4a7a4a;
  --state-warning: #b8862a;
  --state-error:   #a83232;
  --state-info:    #3a6a8a;

  /* ---- Radius ---- */
  --bj-radius-sm:   2px;
  --bj-radius-md:   8px;
  --bj-radius-lg:   12px;
  --bj-radius-full: 9999px;

  /* ---- Typography ---- */
  --font-display: "Oswald", "Bebas Neue", "Impact", "Noto Sans SC", sans-serif;
  --font-body: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
}

/* ============================================================
   Semantic aliases (required by apply-html-head-contract.mjs)
   ============================================================ */
:root {
  --bj-background: var(--bj-neutral-50);
  --bj-foreground: var(--bj-neutral-900);
  --bj-card: var(--bj-primary-50);
  --bj-card-foreground: var(--bj-neutral-900);
  --bj-popover: var(--bj-neutral-0);
  --bj-popover-foreground: var(--bj-neutral-900);
  --bj-primary: var(--bj-primary-700);
  --bj-primary-foreground: var(--bj-primary-50);
  --bj-muted: var(--bj-neutral-200);
  --bj-muted-foreground: var(--bj-neutral-500);
  --bj-border: var(--bj-neutral-300);
  --bj-input: var(--bj-neutral-300);
  --bj-ring: var(--bj-primary-500);

  /* ---- Per-beast accent (default = neutral ink) ---- */
  --bj-accent: var(--bj-neutral-700);
  --bj-accent-soft: var(--bj-neutral-400);
  --bj-accent-glow: rgba(94, 90, 78, 0.35);
}

/* ============================================================
   Per-beast accent hues — applied via [data-beast="..."]
   Each beast gets: accent, soft tint, glow color, particle color
   ============================================================ */
[data-beast="shukaku"] {
  --bj-accent: #c98a3a;       /* sand gold */
  --bj-accent-soft: #e0b878;
  --bj-accent-glow: rgba(201, 138, 58, 0.45);
  --bj-particle: #d9a85a;
}
[data-beast="matatabi"] {
  --bj-accent: #2e6fb5;       /* spectral blue */
  --bj-accent-soft: #6aa3d8;
  --bj-accent-glow: rgba(46, 111, 181, 0.5);
  --bj-particle: #5aa0e8;
}
[data-beast="isobu"] {
  --bj-accent: #3f7a5e;       /* mist green */
  --bj-accent-soft: #7aaa90;
  --bj-accent-glow: rgba(63, 122, 94, 0.45);
  --bj-particle: #6aa080;
}
[data-beast="kokuo"] {
  --bj-accent: #5b8fc4;       /* boil water blue */
  --bj-accent-soft: #9bc0e0;
  --bj-accent-glow: rgba(91, 143, 196, 0.45);
  --bj-particle: #8ab8e0;
}
[data-beast="saiken"] {
  --bj-accent: #3fb0a8;       /* acid teal */
  --bj-accent-soft: #7fd4cd;
  --bj-accent-glow: rgba(63, 176, 168, 0.5);
  --bj-particle: #5fd4c8;
}
[data-beast="chomei"] {
  --bj-accent: #4ea64e;       /* beetle emerald */
  --bj-accent-soft: #8acc84;
  --bj-accent-glow: rgba(78, 166, 78, 0.45);
  --bj-particle: #7ac870;
}
[data-beast="gyuki"] {
  --bj-accent: #7a3fb0;       /* ink violet */
  --bj-accent-soft: #b07fd4;
  --bj-accent-glow: rgba(122, 63, 176, 0.5);
  --bj-particle: #a070d8;
}
[data-beast="kurama"] {
  --bj-accent: #d24a2a;       /* fox crimson */
  --bj-accent-soft: #e88a6a;
  --bj-accent-glow: rgba(210, 74, 42, 0.5);
  --bj-particle: #e86a4a;
}

/* ============================================================
   Dark mode aliases
   ============================================================ */
.dark {
  --bj-background: var(--bj-neutral-900);
  --bj-foreground: var(--bj-neutral-100);
  --bj-card: var(--bj-neutral-800);
  --bj-card-foreground: var(--bj-neutral-100);
  --bj-popover: var(--bj-neutral-800);
  --bj-popover-foreground: var(--bj-neutral-100);
  --bj-primary: var(--bj-primary-400);
  --bj-primary-foreground: var(--bj-neutral-900);
  --bj-muted: var(--bj-neutral-700);
  --bj-muted-foreground: var(--bj-neutral-400);
  --bj-border: var(--bj-neutral-700);
  --bj-input: var(--bj-neutral-600);
  --bj-ring: var(--bj-primary-300);
}

    </style>

    <style id="shukaku-animations">
      /* ============ KEYFRAMES ============ */

      /* Hero shatter/burst entrance: scale + rotate + crack wipe */
      @keyframes shukaku-shatter-in {
        0%   { transform: scale(0.6) rotate(-8deg); opacity: 0; filter: blur(14px) brightness(1.8); }
        35%  { opacity: 1; filter: blur(0) brightness(1.4); }
        55%  { transform: scale(1.06) rotate(1.2deg); filter: blur(0) brightness(1.1); }
        75%  { transform: scale(0.99) rotate(-0.6deg); }
        100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0) brightness(1); }
      }

      /* Continuous breathing scale on the hero image */
      @keyframes shukaku-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.025); }
      }

      /* Claw-slash draw: clip-path wipe from left to right */
      @keyframes claw-slash-draw {
        0%   { clip-path: inset(0 100% 0 0); opacity: 0; transform: translateX(-12px) skewX(-8deg); }
        40%  { opacity: 1; }
        70%  { clip-path: inset(0 0 0 0); opacity: 1; transform: translateX(0) skewX(-8deg); }
        100% { clip-path: inset(0 0 0 0); opacity: 0.9; transform: translateX(0) skewX(-8deg); }
      }

      /* Rotating seal */
      @keyframes seal-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* Spiral pulse */
      @keyframes spiral-pulse {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
        50%      { transform: scale(1.12) rotate(20deg); opacity: 1; }
      }

      /* Vertical Japanese text slide-in */
      @keyframes kanji-slide-in {
        0%   { opacity: 0; transform: translateY(-18px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      /* Staggered fade-up for info panel */
      @keyframes info-fade-up {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Hazard triangle pulse */
      @keyframes hazard-pulse {
        0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
        50%      { opacity: 0.55; transform: scale(0.92); filter: drop-shadow(0 0 8px rgba(168,50,50,0.7)); }
      }

      /* Threat-rating star fill (one-by-one) */
      @keyframes star-fill {
        0%   { color: var(--bj-neutral-300); transform: scale(0.4) rotate(-30deg); }
        60%  { transform: scale(1.25) rotate(8deg); }
        100% { color: var(--bj-accent); transform: scale(1) rotate(0deg); }
      }

      /* Barcode scan line sweep */
      @keyframes barcode-scan {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      /* Sandstorm particle drift upward + fade */
      @keyframes sand-drift-up {
        0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.85; }
        50%  { transform: translate(var(--drift-x, 30px), -50vh) rotate(180deg); opacity: 0.7; }
        90%  { opacity: 0.3; }
        100% { transform: translate(calc(var(--drift-x, 30px) * 1.6), -110vh) rotate(360deg); opacity: 0; }
      }

      /* Lateral sand drift across screen */
      @keyframes sand-drift-side {
        0%   { transform: translateX(-10vw) translateY(0); opacity: 0; }
        15%  { opacity: 0.6; }
        85%  { opacity: 0.5; }
        100% { transform: translateX(110vw) translateY(var(--drift-y, -40px)); opacity: 0; }
      }

      /* Debris shift on shattered border */
      @keyframes debris-shift {
        0%, 100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
        25%      { transform: translate(2px, -1px) rotate(calc(var(--rot, 0deg) + 3deg)); }
        50%      { transform: translate(-1px, 2px) rotate(calc(var(--rot, 0deg) - 2deg)); }
        75%      { transform: translate(1px, 1px) rotate(calc(var(--rot, 0deg) + 1deg)); }
      }

      /* Scanline subtle vertical drift */
      @keyframes scanline-drift {
        from { background-position: 0 0; }
        to   { background-position: 0 100px; }
      }

      /* Grain flicker */
      @keyframes grain-flicker {
        0%, 100% { opacity: 0.06; }
        50%      { opacity: 0.1; }
      }

      /* Title glow throb */
      @keyframes title-glow {
        0%, 100% { text-shadow: 0 0 0 transparent; }
        50%      { text-shadow: 0 0 18px var(--bj-accent-glow); }
      }

      /* Card frame settle-in */
      @keyframes card-settle {
        0%   { opacity: 0; transform: translateY(20px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Stamp thud */
      @keyframes stamp-thud {
        0%   { transform: scale(2.4) rotate(-24deg); opacity: 0; }
        60%  { transform: scale(0.92) rotate(-13deg); opacity: 1; }
        80%  { transform: scale(1.04) rotate(-15deg); }
        100% { transform: scale(1) rotate(-15deg); opacity: 0.92; }
      }

      /* ============ ANIMATION UTILITIES ============ */
      .anim-shatter      { animation: shukaku-shatter-in 1.6s cubic-bezier(0.2, 0.85, 0.25, 1) both; }
      .anim-breathe      { animation: shukaku-breathe 6s ease-in-out infinite; }
      /* Combined: shatter entrance once, then continuous breathing starting after entrance */
      .anim-shatter-breathe {
        animation: shukaku-shatter-in 1.6s cubic-bezier(0.2, 0.85, 0.25, 1) both,
                   shukaku-breathe 6s ease-in-out 1.7s infinite;
      }
      .anim-seal-spin    { animation: seal-spin 26s linear infinite; }
      .anim-spiral       { animation: spiral-pulse 4s ease-in-out infinite; }
      .anim-hazard       { animation: hazard-pulse 1.6s ease-in-out infinite; }
      .anim-card-settle  { animation: card-settle 0.9s ease-out both; }
      .anim-grain        { animation: grain-flicker 0.18s steps(2) infinite; }
      .anim-glow         { animation: title-glow 4.5s ease-in-out infinite; }
      .anim-stamp        { animation: stamp-thud 0.7s cubic-bezier(0.3, 1.6, 0.4, 1) both; animation-delay: 2.2s; }

      .anim-claw-1 { animation: claw-slash-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.1s; }
      .anim-claw-2 { animation: claw-slash-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.35s; }
      .anim-claw-3 { animation: claw-slash-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.6s; }

      .anim-kanji { animation: kanji-slide-in 0.9s ease-out both; }

      .anim-info-1 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.5s; }
      .anim-info-2 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.65s; }
      .anim-info-3 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.8s; }
      .anim-info-4 { animation: info-fade-up 0.6s ease-out both; animation-delay: 0.95s; }
      .anim-info-5 { animation: info-fade-up 0.6s ease-out both; animation-delay: 1.1s; }

      .anim-star-1 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 2.5s; }
      .anim-star-2 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 2.75s; }
      .anim-star-3 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 3.0s; }
      .anim-star-4 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 3.25s; }
      .anim-star-5 { animation: star-fill 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 3.5s; }

      .anim-debris { animation: debris-shift 7s ease-in-out infinite; }

      .barcode-scanline {
        position: absolute; top: 0; left: 0; width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(201,138,58,0.5), transparent);
        animation: barcode-scan 2.4s linear infinite;
      }

      /* ============ PARTICLE BASE ============ */
      .sand-particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        background: var(--bj-particle);
        will-change: transform, opacity;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        /* ---------- Layout-critical static CSS (renders w/o Tailwind) ---------- */
        .sk-stage {
          position: relative;
          min-height: 100vh;
          width: 100%;
          padding: 28px 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          background:
            radial-gradient(120% 90% at 50% 0%, var(--bj-primary-100) 0%, var(--bj-primary-200) 45%, var(--bj-primary-300) 100%);
          overflow: hidden;
          box-sizing: border-box;
        }
        .sk-card {
          position: relative;
          width: 100%;
          max-width: 1400px;
          aspect-ratio: 3 / 4;
          max-height: 92vh;
          background:
            linear-gradient(180deg, var(--bj-primary-50) 0%, var(--bj-primary-100) 60%, var(--bj-primary-200) 100%);
          border: 3px solid var(--bj-primary-700);
          box-shadow:
            0 30px 80px rgba(34, 31, 19, 0.55),
            inset 0 0 0 2px var(--bj-primary-300),
            inset 0 0 60px rgba(154, 140, 99, 0.25);
          overflow: hidden;
          display: grid;
          grid-template-rows: auto 1fr auto;
        }
        @media (max-width: 768px) {
          .sk-stage { padding: 10px 6px; }
          .sk-card { aspect-ratio: 9 / 16; max-height: 96vh; border-width: 2px; }
        }

        /* ---------- Weathered parchment texture overlay ---------- */
        .sk-parchment-noise {
          position: absolute; inset: 0; pointer-events: none; z-index: 30;
          background-image:
            radial-gradient(circle at 20% 30%, rgba(122, 111, 74, 0.10) 0, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(95, 84, 54, 0.10) 0, transparent 45%),
            repeating-linear-gradient(45deg, rgba(122, 111, 74, 0.035) 0 2px, transparent 2px 5px);
          mix-blend-mode: multiply;
        }

        /* ---------- Scanline / grain overlay ---------- */
        .sk-scanlines {
          position: absolute; inset: 0; pointer-events: none; z-index: 31;
          background: repeating-linear-gradient(
            0deg,
            rgba(34, 31, 19, 0.05) 0px,
            rgba(34, 31, 19, 0.05) 1px,
            transparent 1px,
            transparent 3px
          );
          animation: scanline-drift 8s linear infinite;
          mix-blend-mode: multiply;
        }
        .sk-grain {
          position: absolute; inset: -50%; pointer-events: none; z-index: 32;

      <script>
        // ====== Sandstorm particle generation ======
        (function () {
          var layer = document.getElementById('skParticles');
          if (!layer) return;
          var COUNT = window.innerWidth < 768 ? 28 : 60;
          var frag = document.createDocumentFragment();
          for (var i = 0; i < COUNT; i++) {
            var p = document.createElement('span');
            p.className = 'sand-particle';
            var size = Math.random() * 3.5 + 1;
            var up = Math.random() > 0.5; // half drift up, half drift side
            var dur = (Math.random() * 9 + 7).toFixed(2);
            var delay = (Math.random() * -14).toFixed(2);
            var driftX = (Math.random() * 120 - 60).toFixed(0);
            var driftY = (Math.random() * -80 - 10).toFixed(0);
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = (Math.random() * 100) + '%';
            p.style.top = up ? (85 + Math.random() * 15) + '%' : (Math.random() * 100) + '%';
            p.style.opacity = (Math.random() * 0.5 + 0.25).toFixed(2);
            p.style.setProperty('--drift-x', driftX + 'px');
            p.style.setProperty('--drift-y', driftY + 'px');
            p.style.animation = (up ? 'sand-drift-up ' : 'sand-drift-side ') + dur + 's linear ' + delay + 's infinite';
            frag.appendChild(p);
          }
          layer.appendChild(frag);
        })();

        // ====== Barcode bars generation ======
        (function () {
          var bars = document.getElementById('skBars');
          if (!bars) return;
          var pattern = [3,1,2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,1,1,2,1,3,1,2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,1];
          var frag = document.createDocumentFragment();
          for (var i = 0; i < pattern.length; i++) {
            var b = document.createElement('span');
            b.style.width = pattern[i] + 'px';
            b.style.height = '100%';
            frag.appendChild(b);
          }
          bars.appendChild(frag);
        })();
      </script>

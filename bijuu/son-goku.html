<html lang="zh-CN" data-beast="son-goku" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">

    <title>孙悟空 · 四尾</title>
    <style id="theme-vars">
/* ============================================================
   BIJUU ANIMATED POSTERS — Brand CSS
   Weathered collectible-card aesthetic, military/classified document tone.
   One neutral parchment base + per-beast accent hue applied via
   data-beast attributes on the page root.
   ============================================================ */

:root {
  /* ---- Brand primary (parchment / aged document) ---- */
  --bj-primary-50:  #fbfaf6;
  --bj-primary-100: #f4f1e8;
  --bj-primary-200: #e8e2d0;
  --bj-primary-300: #d6cdb2;
  --bj-primary-400: #b8ad8a;
  --bj-primary-500: #9a8c63;
  --bj-primary-600: #7d6f4a;
  --bj-primary-700: #5f5436;
  --bj-primary-800: #3d3621;
  --bj-primary-900: #221f13;

  /* ---- Neutral (ink / concrete) ---- */
  --bj-neutral-0:   #ffffff;
  --bj-neutral-50:  #f6f5f2;
  --bj-neutral-100: #eceae4;
  --bj-neutral-200: #d4d1c8;
  --bj-neutral-300: #b0aca0;
  --bj-neutral-400: #847f70;
  --bj-neutral-500: #5e5a4e;
  --bj-neutral-600: #44413a;
  --bj-neutral-700: #2f2d28;
  --bj-neutral-800: #1d1c19;
  --bj-neutral-900: #100f0e;

  /* ---- State tokens ---- */
  --state-success: #4a7a4a;
  --state-warning: #b8862a;
  --state-error:   #a83232;
  --state-info:    #3a6a8a;

  /* ---- Radius ---- */
  --bj-radius-sm:   2px;
  --bj-radius-md:   8px;
  --bj-radius-lg:   12px;
  --bj-radius-full: 9999px;

  /* ---- Typography ---- */
  --font-display: "Oswald", "Bebas Neue", "Impact", "Noto Sans SC", sans-serif;
  --font-body: "Inter", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
}

/* ============================================================
   Semantic aliases (required by apply-html-head-contract.mjs)
   ============================================================ */
:root {
  --bj-background: var(--bj-neutral-50);
  --bj-foreground: var(--bj-neutral-900);
  --bj-card: var(--bj-primary-50);
  --bj-card-foreground: var(--bj-neutral-900);
  --bj-popover: var(--bj-neutral-0);
  --bj-popover-foreground: var(--bj-neutral-900);
  --bj-primary: var(--bj-primary-700);
  --bj-primary-foreground: var(--bj-primary-50);
  --bj-muted: var(--bj-neutral-200);
  --bj-muted-foreground: var(--bj-neutral-500);
  --bj-border: var(--bj-neutral-300);
  --bj-input: var(--bj-neutral-300);
  --bj-ring: var(--bj-primary-500);

  /* ---- Per-beast accent (default = neutral ink) ---- */
  --bj-accent: var(--bj-neutral-700);
  --bj-accent-soft: var(--bj-neutral-400);
  --bj-accent-glow: rgba(94, 90, 78, 0.35);
}

/* ============================================================
   Per-beast accent hues — applied via [data-beast="..."]
   Each beast gets: accent, soft tint, glow color, particle color
   ============================================================ */
[data-beast="shukaku"] {
  --bj-accent: #c98a3a;       /* sand gold */
  --bj-accent-soft: #e0b878;
  --bj-accent-glow: rgba(201, 138, 58, 0.45);
  --bj-particle: #d9a85a;
}
[data-beast="matatabi"] {
  --bj-accent: #2e6fb5;       /* spectral blue */
  --bj-accent-soft: #6aa3d8;
  --bj-accent-glow: rgba(46, 111, 181, 0.5);
  --bj-particle: #5aa0e8;
}
[data-beast="isobu"] {
  --bj-accent: #3f7a5e;       /* mist green */
  --bj-accent-soft: #7aaa90;
  --bj-accent-glow: rgba(63, 122, 94, 0.45);
  --bj-particle: #6aa080;
}
[data-beast="kokuo"] {
  --bj-accent: #5b8fc4;       /* boil water blue */
  --bj-accent-soft: #9bc0e0;
  --bj-accent-glow: rgba(91, 143, 196, 0.45);
  --bj-particle: #8ab8e0;
}
[data-beast="saiken"] {
  --bj-accent: #3fb0a8;       /* acid teal */
  --bj-accent-soft: #7fd4cd;
  --bj-accent-glow: rgba(63, 176, 168, 0.5);
  --bj-particle: #5fd4c8;
}
[data-beast="chomei"] {
  --bj-accent: #4ea64e;       /* beetle emerald */
  --bj-accent-soft: #8acc84;
  --bj-accent-glow: rgba(78, 166, 78, 0.45);
  --bj-particle: #7ac870;
}
[data-beast="gyuki"] {
  --bj-accent: #7a3fb0;       /* ink violet */
  --bj-accent-soft: #b07fd4;
  --bj-accent-glow: rgba(122, 63, 176, 0.5);
  --bj-particle: #a070d8;
}
[data-beast="kurama"] {
  --bj-accent: #d24a2a;       /* fox crimson */
  --bj-accent-soft: #e88a6a;
  --bj-accent-glow: rgba(210, 74, 42, 0.5);
  --bj-particle: #e86a4a;
}

/* ============================================================
   Dark mode aliases
   ============================================================ */
.dark {
  --bj-background: var(--bj-neutral-900);
  --bj-foreground: var(--bj-neutral-100);
  --bj-card: var(--bj-neutral-800);
  --bj-card-foreground: var(--bj-neutral-100);
  --bj-popover: var(--bj-neutral-800);
  --bj-popover-foreground: var(--bj-neutral-100);
  --bj-primary: var(--bj-primary-400);
  --bj-primary-foreground: var(--bj-neutral-900);
  --bj-muted: var(--bj-neutral-700);
  --bj-muted-foreground: var(--bj-neutral-400);
  --bj-border: var(--bj-neutral-700);
  --bj-input: var(--bj-neutral-600);
  --bj-ring: var(--bj-primary-300);
}

    </style>

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

    <style>
      /* ============ SON GOKU KEYFRAMES — LAVA / VOLCANO THEME ============
         Distinct from kurama's pure-fire theme: magma bursts with parabolic
         fall, lava-vein pulsing cracks, heat-haze distortion, rock-debris
         shudder, ape eye glow, dripping lava beads, four-tail energy flow. */

      /* Hero burst entrance — breaks through stone wall with lava eruption */
      @keyframes sg-burst-in {
        0%   { transform: scale(0.5) rotate(-8deg); opacity: 0; filter: blur(18px) brightness(2.4) saturate(1.9); }
        28%  { opacity: 1; filter: blur(0) brightness(1.6) saturate(1.5); }
        52%  { transform: scale(1.1) rotate(2deg); filter: blur(0) brightness(1.2) saturate(1.3); }
        74%  { transform: scale(0.96) rotate(-0.8deg); }
        100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0) brightness(1) saturate(1); }
      }

      /* Continuous breathing — heavier, volcanic heave */
      @keyframes sg-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.035); }
      }

      /* Magma burst — parabolic: shoot up, arc over, fall with gravity */
      @keyframes sg-magma-burst {
        0%   { transform: translate(0, 0) scale(1); opacity: 0; }
        6%   { opacity: 1; }
        40%  { transform: translate(calc(var(--burst-x, 30px) * 0.7), -45vh) scale(0.9); opacity: 0.9; }
        70%  { transform: translate(calc(var(--burst-x, 30px) * 1.1), -52vh) scale(0.7); opacity: 0.6; }
        100% { transform: translate(calc(var(--burst-x, 30px) * 1.4), -38vh) scale(0.4); opacity: 0; }
      }

      /* Magma glow flicker (brightness pulse while bursting) */
      @keyframes sg-magma-flicker {
        0%, 100% { filter: brightness(1) drop-shadow(0 0 4px var(--bj-particle)); }
        30%      { filter: brightness(1.5) drop-shadow(0 0 8px var(--bj-accent)); }
        60%      { filter: brightness(0.85) drop-shadow(0 0 3px var(--bj-accent-soft)); }
      }

      /* Lava drip — bead falls from top, stretches, splashes */
      @keyframes sg-lava-drip {
        0%   { transform: translate(0, 0) scaleY(0.6); opacity: 0; }
        8%   { opacity: 1; }
        55%  { transform: translate(0, var(--drip-fall, 60vh)) scaleY(1.3); opacity: 0.95; }
        68%  { transform: translate(0, calc(var(--drip-fall, 60vh) + 4px)) scaleY(0.4); opacity: 0.8; }
        72%  { transform: translate(0, calc(var(--drip-fall, 60vh) + 2px)) scaleY(1.6); opacity: 0.5; }
        100% { transform: translate(0, calc(var(--drip-fall, 60vh) + 10px)) scaleY(0.3); opacity: 0; }
      }

      /* Lava-vein pulse — cracks in hero glow and fade like flowing magma */
      @keyframes sg-lava-vein-pulse {
        0%, 100% { opacity: 0.35; filter: brightness(0.9) blur(0.5px); }
        30%      { opacity: 1; filter: brightness(1.8) blur(0); }
        60%      { opacity: 0.7; filter: brightness(1.3) blur(0.5px); }
      }

      /* Lava glow around hero edges — molten radial aura */
      @keyframes sg-lava-glow-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        35%      { opacity: 0.92; transform: scale(1.05); }
        65%      { opacity: 0.68; transform: scale(1.02); }
      }

      /* Four tails energy flow — molten ribbon sway */
      @keyframes sg-tail-flow {
        0%, 100% { opacity: 0.3; transform: translateX(0) scaleY(1) skewX(0deg); }
        20%      { opacity: 0.6; transform: translateX(-3px) scaleY(1.04) skewX(-3deg); }
        40%      { opacity: 0.42; transform: translateX(3px) scaleY(0.97) skewX(2deg); }
        60%      { opacity: 0.65; transform: translateX(-2px) scaleY(1.03) skewX(-2deg); }
        80%      { opacity: 0.38; transform: translateX(2px) scaleY(1) skewX(1deg); }
      }

      /* Ape eye glow — intense orange pulse, beast roar */
      @keyframes sg-eye-glow {
        0%, 100% { opacity: 0.7; filter: blur(3px) brightness(1); }
        25%      { opacity: 1; filter: blur(6px) brightness(1.8); }
        55%      { opacity: 0.85; filter: blur(4px) brightness(1.4); }
        80%      { opacity: 0.95; filter: blur(5px) brightness(1.6); }
      }

      /* Heat haze distortion — shimmering waves rising from bottom */
      @keyframes sg-heat-haze {
        0%, 100% { transform: translateY(0) scaleX(1) skewX(0deg); opacity: 0.35; filter: blur(3px); }
        33%      { transform: translateY(-3px) scaleX(1.03) skewX(0.6deg); opacity: 0.55; filter: blur(4px); }
        66%      { transform: translateY(-1px) scaleX(0.98) skewX(-0.5deg); opacity: 0.45; filter: blur(3.5px); }
      }

      /* Rock debris shudder — stone shards trembling from wall break */
      @keyframes sg-rock-debris {
        0%, 100% { transform: translate(0, 0) rotate(var(--rot, 0deg)); }
        20%      { transform: translate(2px, -2px) rotate(calc(var(--rot, 0deg) + 4deg)); }
        40%      { transform: translate(-2px, 1px) rotate(calc(var(--rot, 0deg) - 3deg)); }
        60%      { transform: translate(1px, 2px) rotate(calc(var(--rot, 0deg) + 2deg)); }
        80%      { transform: translate(-1px, -1px) rotate(calc(var(--rot, 0deg) - 1deg)); }
      }

      /* Title lava-crack glow — molten cracks pulse through SON GOKU */
      @keyframes sg-title-lava-glow {
        0%, 100% { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 8px var(--bj-accent-glow), 0 0 18px var(--bj-accent-glow); }
        18%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 16px var(--bj-accent), 0 0 34px var(--bj-accent-glow); }
        38%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 6px var(--bj-accent-soft), 0 0 14px var(--bj-accent-glow); }
        58%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 20px var(--bj-accent), 0 0 40px var(--bj-accent-glow), 0 0 60px var(--bj-accent-glow); }
        78%      { text-shadow: 4px 4px 0 var(--bj-primary-900), 0 0 10px var(--bj-accent-soft), 0 0 24px var(--bj-accent-glow); }
      }

      /* Molten scratch reveal — lava-cut wipe across title */
      @keyframes sg-scratch-reveal {
        0%   { clip-path: inset(0 100% 0 0); opacity: 0; transform: translateX(-16px) skewX(-12deg); filter: brightness(3.2); }
        35%  { opacity: 1; filter: brightness(2.4); }
        65%  { clip-path: inset(0 0 0 0); opacity: 1; transform: translateX(0) skewX(-12deg); filter: brightness(1.5); }
        100% { clip-path: inset(0 0 0 0); opacity: 0.92; transform: translateX(0) skewX(-12deg); filter: brightness(1); }
      }

      /* Rotating seal (IWA rock seal) */
      @keyframes sg-seal-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* Spiral pulse — molten core swirl */
      @keyframes sg-spiral-pulse {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
        50%      { transform: scale(1.14) rotate(22deg); opacity: 1; }
      }

      /* Vertical Japanese text slide-in */
      @keyframes sg-kanji-slide-in {
        0%   { opacity: 0; transform: translateY(-18px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      /* Staggered fade-up for info panel */
      @keyframes sg-info-fade-up {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Hazard triangle pulse — lava warning */
      @keyframes sg-hazard-pulse {
        0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
        50%      { opacity: 0.55; transform: scale(0.92); filter: drop-shadow(0 0 8px rgba(212, 86, 26, 0.85)); }
      }

      /* Threat-rating star fill (one-by-one) */
      @keyframes sg-star-fill {
        0%   { color: var(--bj-neutral-300); transform: scale(0.4) rotate(-30deg); }
        60%  { transform: scale(1.25) rotate(8deg); }
        100% { color: var(--bj-accent); transform: scale(1) rotate(0deg); }
      }

      /* Barcode scan line sweep */
      @keyframes sg-barcode-scan {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      /* Scanline subtle vertical drift */
      @keyframes sg-scanline-drift {
        from { background-position: 0 0; }
        to   { background-position: 0 100px; }
      }

      /* Grain flicker */
      @keyframes sg-grain-flicker {
        0%, 100% { opacity: 0.06; }
        50%      { opacity: 0.1; }
      }

      /* Card frame settle-in */
      @keyframes sg-card-settle {
        0%   { opacity: 0; transform: translateY(20px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Stamp thud — molten certification */
      @keyframes sg-stamp-thud {
        0%   { transform: scale(2.4) rotate(-24deg); opacity: 0; }
        60%  { transform: scale(0.92) rotate(-13deg); opacity: 1; }
        80%  { transform: scale(1.04) rotate(-15deg); }
        100% { transform: scale(1) rotate(-15deg); opacity: 0.92; }
      }

      /* ============ ANIMATION UTILITIES ============ */
      .sg-anim-burst        { animation: sg-burst-in 1.8s cubic-bezier(0.2, 0.85, 0.25, 1) both; }
      .sg-anim-breathe      { animation: sg-breathe 6s ease-in-out infinite; }
      /* Combined: burst entrance once, then continuous breathing starting after entrance */
      .sg-anim-burst-breathe {
        animation: sg-burst-in 1.8s cubic-bezier(0.2, 0.85, 0.25, 1) both,
                   sg-breathe 6s ease-in-out 1.9s infinite;
      }
      .sg-anim-seal-spin    { animation: sg-seal-spin 24s linear infinite; }
      .sg-anim-spiral       { animation: sg-spiral-pulse 4s ease-in-out infinite; }
      .sg-anim-hazard       { animation: sg-hazard-pulse 1.5s ease-in-out infinite; }
      .sg-anim-card-settle  { animation: sg-card-settle 0.9s ease-out both; }
      .sg-anim-grain        { animation: sg-grain-flicker 0.18s steps(2) infinite; }
      .sg-anim-title-glow   { animation: sg-title-lava-glow 3.4s ease-in-out infinite; }
      .sg-anim-stamp        { animation: sg-stamp-thud 0.7s cubic-bezier(0.3, 1.6, 0.4, 1) both; animation-delay: 2.3s; }

      .sg-anim-scratch-1 { animation: sg-scratch-reveal 0.95s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.2s; }
      .sg-anim-scratch-2 { animation: sg-scratch-reveal 0.95s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.45s; }
      .sg-anim-scratch-3 { animation: sg-scratch-reveal 0.95s cubic-bezier(0.65, 0, 0.35, 1) both; animation-delay: 1.7s; }

      .sg-anim-kanji { animation: sg-kanji-slide-in 0.9s ease-out both; }

      .sg-anim-info-1 { animation: sg-info-fade-up 0.6s ease-out both; animation-delay: 0.5s; }
      .sg-anim-info-2 { animation: sg-info-fade-up 0.6s ease-out both; animation-delay: 0.65s; }
      .sg-anim-info-3 { animation: sg-info-fade-up 0.6s ease-out both; animation-delay: 0.8s; }

      <script>
        // ====== Magma burst + lava drip generation ======
        // Distinct from kurama: parabolic arc with gravity fall (magma) +
        // falling/stretching lava beads from top (drip), not pure-rise embers.
        (function () {
          var layer = document.getElementById('sgParticles');
          if (!layer) return;
          var COUNT = window.innerWidth < 768 ? 30 : 64;
          var frag = document.createDocumentFragment();

          for (var i = 0; i < COUNT; i++) {
            // 75% magma bursts (parabolic), 25% lava drips (fall from top)
            if (Math.random() < 0.75) {
              // ---- Magma burst particle (parabolic arc, gravity fall) ----
              var p = document.createElement('span');
              p.className = 'sg-magma-particle';
              var size = Math.random() * 3.5 + 1.4;
              var burstDur = (Math.random() * 6 + 6).toFixed(2);
              var burstDelay = (Math.random() * -10).toFixed(2);
              var burstX = (Math.random() * 120 - 60).toFixed(0);
              p.style.width = size + 'px';
              p.style.height = size + 'px';
              p.style.left = (Math.random() * 100) + '%';
              p.style.bottom = (Math.random() * 18) + '%';
              p.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);
              p.style.setProperty('--burst-dur', burstDur + 's');
              p.style.setProperty('--burst-delay', burstDelay + 's');
              p.style.setProperty('--burst-x', burstX + 'px');
              frag.appendChild(p);
            } else {
              // ---- Lava drip bead (falls from top, stretches, splashes) ----
              var d = document.createElement('span');
              d.className = 'sg-lava-drip';
              var dSize = Math.random() * 4 + 3;
              var dripDur = (Math.random() * 4 + 5).toFixed(2);
              var dripDelay = (Math.random() * -9).toFixed(2);
              var dripFall = (Math.random() * 50 + 45).toFixed(0);
              d.style.width = dSize + 'px';
              d.style.height = (dSize * 1.4) + 'px';
              d.style.left = (Math.random() * 100) + '%';
              d.style.top = '0%';
              d.style.setProperty('--drip-dur', dripDur + 's');
              d.style.setProperty('--drip-delay', dripDelay + 's');
              d.style.setProperty('--drip-fall', dripFall + 'vh');
              frag.appendChild(d);
            }
          }
          layer.appendChild(frag);
        })();

        // ====== Barcode bars generation ======
        (function () {
          var bars = document.getElementById('sgBars');
          if (!bars) return;
          var pattern = [3,1,2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,1,1,2,1,3,1,2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,1];
          var frag = document.createDocumentFragment();
          for (var i = 0; i < pattern.length; i++) {
            var b = document.createElement('span');
            b.style.width = pattern[i] + 'px';
            b.style.height = '100%';
            frag.appendChild(b);
          }
          bars.appendChild(frag);
        })();
      </script>
